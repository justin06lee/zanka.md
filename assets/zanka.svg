<svg xmlns="http://www.w3.org/2000/svg" width="660" height="220" viewBox="0 0 660 220" role="img" aria-label="zanka.md — fundamentals, drilled to reflex">
  <defs>
    <pattern id="tone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#000"/>
      <circle cx="6" cy="6" r="1.5" fill="#000"/>
    </pattern>
  </defs>

  <!-- manga panel: white paper, inked frame -->
  <rect x="0" y="0" width="660" height="220" fill="#fff"/>
  <rect x="7" y="7" width="646" height="206" fill="#fff" stroke="#000" stroke-width="5"/>

  <!-- screentone corner -->
  <path d="M650 10 L650 96 L494 10 Z" fill="url(#tone)"/>

  <!-- speed lines -->
  <g stroke="#000" stroke-linecap="round">
    <path d="M36 168 L96 34" stroke-width="2"/>
    <path d="M58 182 L112 62" stroke-width="1.5"/>
    <path d="M22 128 L58 44" stroke-width="1.5"/>
    <path d="M150 196 L196 94" stroke-width="1.5"/>
    <path d="M176 178 L206 116" stroke-width="1"/>
  </g>

  <!-- Lovely Assistaff, inked -->
  <g transform="translate(112,198) rotate(-22)">
    <rect x="-5.5" y="-150" width="11" height="152" rx="5.5" fill="#000"/>
    <path d="M0 -145 C -4 -160, -12 -170, -18 -182" stroke="#000" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M0 -145 C 4 -160, 12 -170, 18 -182" stroke="#000" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M -5 -118 L -23 -126 L -5 -133 Z" fill="#000"/>
    <path d="M -5 -92 L -21 -100 L -5 -107 Z" fill="#000"/>
    <path d="M 5 -105 L 23 -113 L 5 -120 Z" fill="#000"/>
    <path d="M 5 -79 L 21 -87 L 5 -94 Z" fill="#000"/>
    <rect x="-6" y="-52" width="12" height="5" fill="#fff"/>
    <rect x="-6" y="-41" width="12" height="5" fill="#fff"/>
  </g>

  <!-- impact flash at the prongs -->
  <g fill="#000">
    <path d="M176 40 L182 52 L170 50 Z"/>
    <path d="M196 30 L194 44 L186 36 Z"/>
    <path d="M160 26 L168 36 L156 38 Z"/>
  </g>

  <!-- wordmark -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, 'Cascadia Mono', monospace">
    <text x="250" y="76" font-size="13" letter-spacing="3" fill="#000">愛棒 — LOVELY ASSISTAFF</text>
    <text x="246" y="130" font-size="54" font-weight="700" fill="#000">zanka<tspan fill="#fff" stroke="#000" stroke-width="1.8">.md</tspan></text>
    <path d="M250 144 H 502" stroke="#000" stroke-width="3" stroke-linecap="round"/>
    <!-- narration box -->
    <rect x="248" y="156" width="304" height="32" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <text x="262" y="177" font-size="15" fill="#000">fundamentals, drilled to reflex</text>
  </g>
</svg>
